[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pakistan_sdg_agent"
version = "0.1.0"
description = "AI Agent addressing Pakistan Vision 2035 (Uraan Pakistan) and UN SDGs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.18.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
pk-agent = "pakistan_sdg_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]